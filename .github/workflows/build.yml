# Construit automatiquement : l'APK Android, le .exe Windows et l'exécutable Linux.
# Sur GitHub : onglet "Actions" -> "Construire AntiScroll" -> "Run workflow",
# puis télécharge les fichiers dans "Artifacts" en bas de la page.
name: Construire AntiScroll
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Préparer la clé de signature fixe
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/antiscroll.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/antiscroll.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 absent : APK signé avec une clé jetable (pas de mise à jour possible)."
          fi
      - name: Compiler l'APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AntiScroll-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  pc:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installer les dépendances
        run: pip install -r pc/requirements.txt pyinstaller
      - name: Construire l'exécutable
        run: pyinstaller --onefile --windowed --name AntiScroll --paths server --hidden-import server pc/antiscroll.py
      - uses: actions/upload-artifact@v4
        with:
          name: AntiScroll-${{ runner.os }}
          path: dist/*

  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empaqueter l'extension
        run: cd firefox && zip -r ../antiscroll-firefox.xpi .
      - uses: actions/upload-artifact@v4
        with:
          name: AntiScroll-firefox
          path: antiscroll-firefox.xpi

  # À chaque mise à jour de main : publie une "Release" avec des liens directs
  # (faciles à télécharger depuis un téléphone, sans compte GitHub).
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, pc, firefox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Renommer les fichiers
        run: |
          mkdir out
          cp art/AntiScroll-android/app-debug.apk out/AntiScroll.apk
          cp art/AntiScroll-Windows/AntiScroll.exe out/AntiScroll-Windows.exe
          cp art/AntiScroll-Linux/AntiScroll out/AntiScroll-Linux
          cp art/AntiScroll-firefox/antiscroll-firefox.xpi out/antiscroll-firefox.xpi
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AntiScroll 1.0.${{ github.run_number }}
          make_latest: "true"
          body: |
            Lien direct pour le téléphone (toujours la dernière version) :
            https://github.com/${{ github.repository }}/releases/latest/download/AntiScroll.apk
          files: out/*
